name: Предложить шутку
description: Предложите шутку для раздела «шутейка» в приложении ZABOR
title: '[Joke]: '
labels:
  - content
body:
  - type: markdown
    attributes:
      value: |
        Шутка появится в приложении в разделе «шутейка» вместе с переводом на английский язык.

        Перед отправкой прочитайте [ACCEPTABLE-USE.md](https://github.com/vnkdevelop/zabor-desktop/blob/main/ACCEPTABLE-USE.md), раздел 3 и раздел 7. Приложение предназначено для лиц от 14 лет, поэтому материал должен соответствовать этому ограничению.

        Решение о включении принимает правообладатель. Предложение не создаёт обязанности использовать материал, и отклонение не требует объяснения причин.
  - type: textarea
    id: joke
    attributes:
      label: Текст шутки
      description: Приводите текст в том виде, в котором он должен появиться в приложении. Сохраняйте авторские переносы строк.
      placeholder: |
        Что сказало одна стена другой?
        Встретимся на углу.
    validations:
      required: true
  - type: input
    id: translation
    attributes:
      label: Перевод на английский
      description: Необязательно, но желательно. Используется для отображения шутки при английском языке интерфейса.
      placeholder: What did one wall say to the other? Meet you at the corner.
  - type: input
    id: source
    attributes:
      label: Источник и авторство
      description: Если шутка не ваша, укажите, откуда она и кто автор. Это требуется для проверки прав.
      placeholder: Собственная шутка / автор не известен / ссылка на источник
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Категория
      description: Помогает при отборе. Не влияет на решение о включении.
      options:
        - бытовая
        - игра слов
        - абсурд
        - о программистах и технологиях
        - другая
  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждения
      description: Все пункты обязательны. Без них материал не рассматривается.
      options:
        - label: Шутка моя собственная либо её использование не нарушает прав третьих лиц, и я указал источник в поле выше.
          required: true
        - label: Шутка не содержит оскорблений и уничижительных высказываний в адрес отдельных лиц и групп, персональных данных третьих лиц, описаний жестокости, смерти, увечий и материалов сексуального характера.
          required: true
        - label: Шутка пригодна для показа в приложении, предназначенном для лиц от 14 лет.
          required: true
        - label: Я передаю правообладателю проекта простую (неисключительную) безвозмездную лицензию на использование этой шутки в приложении ZABOR и в связанных с ним материалах, включая право на переработку и перевод. Исключительное право остаётся у меня, вознаграждение не выплачивается.
          required: true
        - label: Я согласен с тем, что правообладатель вправе отклонить шутку или удалить её из приложения в любой момент без объяснения причин.
          required: true
        - label: Я проверил существующие issues и не нашёл такой же шутки.
          required: true
