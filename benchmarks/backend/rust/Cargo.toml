[package]
name = "zabor-backend-bench"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
base64 = "=0.23.1"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
uuid = { version = "=1.29.0", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
