[workspace]
members = ["crates/zabor-core", "crates/zabor-dsp", "crates/zabor-dsp-wasm", "crates/zabor-native", "crates/zabor-camera"]
exclude = ["vendor/tract-core-0.21.4", "vendor/webrtc-vad-0.4.0", "vendor/rnnoise2-sys-0.1.2"]
default-members = ["crates/zabor-core", "crates/zabor-dsp", "crates/zabor-dsp-wasm"]
resolver = "2"

[patch.crates-io]
tract-core = { path = "vendor/tract-core-0.21.4" }
webrtc-vad = { path = "vendor/webrtc-vad-0.4.0" }
rnnoise2-sys = { path = "vendor/rnnoise2-sys-0.1.2" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
