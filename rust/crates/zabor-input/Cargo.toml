[package]
name = "zabor-input"
version = "0.1.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
