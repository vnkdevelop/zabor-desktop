[package]
name = "zabor-native"
version = "0.1.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
png = "0.18"

[build-dependencies]
slint-build = "=1.18.1"

[lints.rust]
unsafe_code = "deny"
