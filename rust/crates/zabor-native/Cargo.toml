[package]
name = "zabor-native"
version = "0.1.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "zabor-native"
path = "src/main.rs"
required-features = ["native-media"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
zeroize = { version = "1", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
p256 = { version = "0.13", features = ["ecdh", "jwk"] }
aes-gcm = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
tempfile = "3"
libwebrtc = { version = "=0.4.0", optional = true }
zabor-dsp = { path = "../zabor-dsp" }
zabor-profile-helper = { path = "../zabor-profile-helper" }
webrtc-vad = "=0.4.0"
zabor-input = { path = "../zabor-input", optional = true }
df = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract"], optional = true }
ndarray = { version = "0.15", optional = true }
rnnoise2 = { version = "=0.1.2", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "copy-dylibs", "api-31"], optional = true }
tract-core = { version = "=0.21.4", optional = true }
tract-data = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-linalg = { version = "=0.21.4", optional = true }
tract-nnef = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-onnx-opl = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
tract-pulse-opl = { version = "=0.21.4", optional = true }

[target.'cfg(windows)'.dependencies]
flate2 = { version = "=1.1.10", features = ["rust_backend"] }
windows-dpapi = "0.2"
wasapi = "=0.26.0"
zabor-camera = { path = "../zabor-camera", optional = true }
zabor-stream-audio = { path = "../zabor-stream-audio", optional = true }
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2"] }

[features]
default = ["native-media", "neural-dsp"]
native-media = ["dep:libwebrtc", "dep:zabor-camera", "dep:zabor-stream-audio", "dep:zabor-input"]
camera-test-source = ["native-media", "zabor-camera/test-source"]
profile-import-test-source = []
stream-audio-test-source = ["native-media", "zabor-stream-audio/test-source"]
audio-test-source = ["native-media"]
neural-dsp = ["dep:df", "dep:ndarray", "dep:rnnoise2", "dep:ort", "dep:tract-core", "dep:tract-data", "dep:tract-hir", "dep:tract-linalg", "dep:tract-nnef", "dep:tract-onnx", "dep:tract-onnx-opl", "dep:tract-pulse", "dep:tract-pulse-opl"]

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["renderer-software"] }

[lints.rust]
unsafe_code = "deny"
