[package]
name = "zabor-stream-audio"
version = "0.1.0"
edition.workspace = true
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }

[features]
test-source = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
